# docker-compose.prod.yml
#
# Entorno de producción (VPS).
#
# SUPUESTO: Las bases de datos y RabbitMQ son instancias externas o gestionadas.
# Este archivo NO levanta contenedores de infraestructura de datos.
# Todos los valores sensibles deben estar en .env.prod (NO commiteado al repo).
#
# Uso:
#   cp .env.prod.example .env.prod   # Rellena con los valores reales de producción
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# O con Make:
#   make prod-up
#   make prod-down
#   make prod-logs
#
# IMPORTANTE: Las imágenes se esperan ya construidas (CI/CD) o se construyen
# in-place con --build. No usar RabbitMQ embebido; apuntar al host externo
# a través de RABBITMQ_HOST en .env.prod.

services:

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    image: orionticket/identity-service:${IMAGE_TAG:-latest}
    container_name: identity-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    restart: unless-stopped
    networks:
      - orionticket-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  event-management-service:
    build:
      context: ./event-management-service
      dockerfile: Dockerfile
    image: orionticket/event-management-service:${IMAGE_TAG:-latest}
    container_name: event-management-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
    ports:
      - "${EVENT_MANAGEMENT_SERVICE_PORT:-8082}:8082"
    restart: unless-stopped
    networks:
      - orionticket-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  seating-inventory-service:
    build:
      context: ./seating-inventory-service
      dockerfile: Dockerfile
    image: orionticket/seating-inventory-service:${IMAGE_TAG:-latest}
    container_name: seating-inventory-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
    ports:
      - "${SEATING_INVENTORY_SERVICE_PORT:-8083}:8083"
    restart: unless-stopped
    networks:
      - orionticket-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    image: orionticket/orders-service:${IMAGE_TAG:-latest}
    container_name: orders-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service:8082
      SEATING_INVENTORY_SERVICE_URL: http://seating-inventory-service:8083
    ports:
      - "${ORDERS_SERVICE_PORT:-8084}:8084"
    restart: unless-stopped
    depends_on:
      event-management-service:
        condition: service_healthy
      seating-inventory-service:
        condition: service_healthy
    networks:
      - orionticket-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  payments-service:
    build:
      context: ./payments-service
      dockerfile: Dockerfile
    image: orionticket/payments-service:${IMAGE_TAG:-latest}
    container_name: payments-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8085
      ORDERS_SERVICE_URL: http://orders-service:8084
    ports:
      - "${PAYMENTS_SERVICE_PORT:-8085}:8085"
    restart: unless-stopped
    depends_on:
      orders-service:
        condition: service_healthy
    networks:
      - orionticket-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ticket-issuance-service:
    build:
      context: ./ticket-issuance-service
      dockerfile: Dockerfile
    image: orionticket/ticket-issuance-service:${IMAGE_TAG:-latest}
    container_name: ticket-issuance-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8086
    ports:
      - "${TICKET_ISSUANCE_SERVICE_PORT:-8086}:8086"
    restart: unless-stopped
    networks:
      - orionticket-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  access-control-service:
    build:
      context: ./access-control-service
      dockerfile: Dockerfile
    image: orionticket/access-control-service:${IMAGE_TAG:-latest}
    container_name: access-control-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8087
      TICKET_ISSUANCE_URL: http://ticket-issuance-service:8086
    ports:
      - "${ACCESS_CONTROL_SERVICE_PORT:-8087}:8087"
    restart: unless-stopped
    depends_on:
      ticket-issuance-service:
        condition: service_healthy
    networks:
      - orionticket-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  notifications-service:
    build:
      context: ./notifications-service
      dockerfile: Dockerfile
    image: orionticket/notifications-service:${IMAGE_TAG:-latest}
    container_name: notifications-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
    ports:
      - "${NOTIFICATIONS_SERVICE_PORT:-8088}:8088"
    restart: unless-stopped
    networks:
      - orionticket-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    image: orionticket/reporting-service:${IMAGE_TAG:-latest}
    container_name: reporting-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8089
    ports:
      - "${REPORTING_SERVICE_PORT:-8089}:8089"
    restart: unless-stopped
    networks:
      - orionticket-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    image: orionticket/gateway-service:${IMAGE_TAG:-latest}
    container_name: gateway-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-service:8081
      EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service:8082
      SEATING_INVENTORY_SERVICE_URL: http://seating-inventory-service:8083
      ORDERS_SERVICE_URL: http://orders-service:8084
      PAYMENTS_SERVICE_URL: http://payments-service:8085
      TICKET_ISSUANCE_SERVICE_URL: http://ticket-issuance-service:8086
      ACCESS_CONTROL_SERVICE_URL: http://access-control-service:8087
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8088
      REPORTING_SERVICE_URL: http://reporting-service:8089
    ports:
      - "${GATEWAY_SERVICE_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_healthy
      event-management-service:
        condition: service_healthy
      seating-inventory-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
      ticket-issuance-service:
        condition: service_healthy
      access-control-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    networks:
      - orionticket-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

# ── Networks ──────────────────────────────────────────────────────────────

networks:
  orionticket-prod:
    name: orionticket-prod
    driver: bridge
