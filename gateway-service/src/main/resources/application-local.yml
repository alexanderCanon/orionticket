spring:
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
          predicates:
            - Path=/v1/auth/**,/v1/users/**,/v1/roles/**,/v1/organizers/**
        - id: event-management-service
          uri: ${EVENT_MANAGEMENT_SERVICE_URL:http://event-management-service:8082}
          predicates:
            - Path=/v1/events/**,/v1/venues/**,/v1/catalog/**
        - id: seating-inventory-service
          uri: ${SEATING_INVENTORY_SERVICE_URL:http://seating-inventory-service:8083}
          predicates:
            - Path=/v1/seats/**,/v1/reservations/**,/v1/batches/**,/v1/availability/**
        - id: orders-service
          uri: ${ORDERS_SERVICE_URL:http://orders-service:8084}
          predicates:
            - Path=/v1/orders/**,/v1/checkout/**
        - id: payments-service
          uri: ${PAYMENTS_SERVICE_URL:http://payments-service:8085}
          predicates:
            - Path=/v1/payments/**,/v1/payouts/**
        - id: ticket-issuance-service
          uri: ${TICKET_ISSUANCE_SERVICE_URL:http://ticket-issuance-service:8086}
          predicates:
            - Path=/v1/tickets/**,/v1/buyers/*/tickets
        - id: access-control-service
          uri: ${ACCESS_CONTROL_SERVICE_URL:http://access-control-service:8087}
          predicates:
            - Path=/v1/validations/**
        - id: notifications-service
          uri: ${NOTIFICATIONS_SERVICE_URL:http://notifications-service:8088}
          predicates:
            - Path=/v1/notifications/**
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://reporting-service:8089}
          predicates:
            - Path=/v1/reports/**

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
