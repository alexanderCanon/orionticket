x-service-healthcheck: &service-healthcheck
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

services:
    event-management-service:
        build:
            context: ./event-management-service
            dockerfile: Dockerfile
        container_name: event-management-service-lab
        env_file:
            - ${ORION_ENV_FILE:-.env}
        environment:
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-lab}
            SERVER_PORT: 8082
            DB_HOST: ${GLOBAL_DB_HOST:?GLOBAL_DB_HOST is required}
            DB_PORT: 5000
            DB_SCHEMA: event_management
            RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
            IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:?IDENTITY_JWKS_URI is required}
            JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
            JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
            OTEL_SERVICE_NAME: "event-management-service"
            OTEL_TRACES_EXPORTER: "otlp"
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-alloy:4317"
            OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
            OTEL_METRICS_EXPORTER: "none"
            OTEL_LOGS_EXPORTER: "none"
        ports:
            - "${EVENT_MANAGEMENT_SERVICE_PORT:-8082}:8082"
        healthcheck:
            <<: *service-healthcheck
            test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
        networks:
            - orionticket-services-lab
        deploy:
            resources:
                limits:
                    memory: ${SERVICE_MEM_LIMIT:-512m}

    seating-inventory-service:
        build:
            context: ./seating-inventory-service
            dockerfile: Dockerfile
        container_name: seating-inventory-service-lab
        env_file:
            - ${ORION_ENV_FILE:-.env}
        environment:
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-lab}
            SERVER_PORT: 8083
            DB_HOST: ${GLOBAL_DB_HOST:?GLOBAL_DB_HOST is required}
            DB_PORT: 5000
            DB_SCHEMA: seating_inventory
            RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
            IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:?IDENTITY_JWKS_URI is required}
            JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
            JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
            OTEL_SERVICE_NAME: "seating-inventory-service"
            OTEL_TRACES_EXPORTER: "otlp"
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-alloy:4317"
            OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
            OTEL_METRICS_EXPORTER: "none"
            OTEL_LOGS_EXPORTER: "none"
        ports:
            - "${SEATING_INVENTORY_SERVICE_PORT:-8083}:8083"
        healthcheck:
            <<: *service-healthcheck
            test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
        networks:
            - orionticket-services-lab
        deploy:
            resources:
                limits:
                    memory: ${SERVICE_MEM_LIMIT:-512m}

    orders-service:
        build:
            context: ./orders-service
            dockerfile: Dockerfile
        container_name: orders-service-lab
        env_file:
            - ${ORION_ENV_FILE:-.env}
        environment:
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-lab}
            SERVER_PORT: 8084
            DB_HOST: ${GLOBAL_DB_HOST:?GLOBAL_DB_HOST is required}
            DB_PORT: 5000
            DB_SCHEMA: orders
            RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
            IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:?IDENTITY_JWKS_URI is required}
            JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
            EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service:8082
            SEATING_INVENTORY_SERVICE_URL: http://seating-inventory-service:8083
            JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
            OTEL_SERVICE_NAME: "orders-service"
            OTEL_TRACES_EXPORTER: "otlp"
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-alloy:4317"
            OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
            OTEL_METRICS_EXPORTER: "none"
            OTEL_LOGS_EXPORTER: "none"
        ports:
            - "${ORDERS_SERVICE_PORT:-8084}:8084"
        depends_on:
            event-management-service:
                condition: service_healthy
            seating-inventory-service:
                condition: service_healthy
        healthcheck:
            <<: *service-healthcheck
            test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
        networks:
            - orionticket-services-lab
        deploy:
            resources:
                limits:
                    memory: ${SERVICE_MEM_LIMIT:-512m}

    payments-service:
        build:
            context: ./payments-service
            dockerfile: Dockerfile
        container_name: payments-service-lab
        env_file:
            - ${ORION_ENV_FILE:-.env}
        environment:
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-lab}
            SERVER_PORT: 8085
            DB_HOST: ${GLOBAL_DB_HOST:?GLOBAL_DB_HOST is required}
            DB_PORT: 5000
            DB_SCHEMA: payments
            RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
            IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:?IDENTITY_JWKS_URI is required}
            JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
            ORDERS_SERVICE_URL: http://orders-service:8084
            EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service:8082
            JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
            OTEL_SERVICE_NAME: "payments-service"
            OTEL_TRACES_EXPORTER: "otlp"
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-alloy:4317"
            OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
            OTEL_METRICS_EXPORTER: "none"
            OTEL_LOGS_EXPORTER: "none"
        ports:
            - "${PAYMENTS_SERVICE_PORT:-8085}:8085"
        depends_on:
            orders-service:
                condition: service_healthy
            event-management-service:
                condition: service_healthy
        healthcheck:
            <<: *service-healthcheck
            test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
        networks:
            - orionticket-services-lab
        deploy:
            resources:
                limits:
                    memory: ${SERVICE_MEM_LIMIT:-512m}

    ticket-issuance-service:
        build:
            context: ./ticket-issuance-service
            dockerfile: Dockerfile
        container_name: ticket-issuance-service-lab
        env_file:
            - ${ORION_ENV_FILE:-.env}
        environment:
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-lab}
            SERVER_PORT: 8086
            DB_HOST: ${GLOBAL_DB_HOST:?GLOBAL_DB_HOST is required}
            DB_PORT: 5000
            DB_SCHEMA: ticket_issuance
            RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
            IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:?IDENTITY_JWKS_URI is required}
            JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
            JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
            OTEL_SERVICE_NAME: "ticket-issuance-service"
            OTEL_TRACES_EXPORTER: "otlp"
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-alloy:4317"
            OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
            OTEL_METRICS_EXPORTER: "none"
            OTEL_LOGS_EXPORTER: "none"
        ports:
            - "${TICKET_ISSUANCE_SERVICE_PORT:-8086}:8086"
        healthcheck:
            <<: *service-healthcheck
            test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
        networks:
            - orionticket-services-lab
        deploy:
            resources:
                limits:
                    memory: ${SERVICE_MEM_LIMIT:-512m}

    notifications-service:
        build:
            context: ./notifications-service
            dockerfile: Dockerfile
        container_name: notifications-service-lab
        env_file:
            - ${ORION_ENV_FILE:-.env}
        environment:
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-lab}
            SERVER_PORT: 8088
            DB_HOST: ${GLOBAL_DB_HOST:?GLOBAL_DB_HOST is required}
            DB_PORT: 5000
            DB_SCHEMA: notifications
            RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
            IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:?IDENTITY_JWKS_URI is required}
            JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
            JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
            OTEL_SERVICE_NAME: "notifications-service"
            OTEL_TRACES_EXPORTER: "otlp"
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-alloy:4317"
            OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
            OTEL_METRICS_EXPORTER: "none"
            OTEL_LOGS_EXPORTER: "none"
        ports:
            - "${NOTIFICATIONS_SERVICE_PORT:-8088}:8088"
        healthcheck:
            <<: *service-healthcheck
            test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
        networks:
            - orionticket-services-lab
        deploy:
            resources:
                limits:
                    memory: ${SERVICE_MEM_LIMIT:-512m}

    grafana-alloy:
        image: grafana/alloy:latest
        container_name: grafana-alloy-lab
        volumes:
            - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
        entrypoint:
            - /bin/alloy
            - run
            - --config.file=/etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
        env_file:
            - ${ORION_ENV_FILE:-.env}
        ports:
            - "12345:12345" # Alloy dashboard UI
            - "4317:4317" # OTLP gRPC
            - "4318:4318" # OTLP HTTP
        networks:
            - orionticket-services-lab
        depends_on:
            event-management-service:
                condition: service_started
            seating-inventory-service:
                condition: service_started
            orders-service:
                condition: service_started
            payments-service:
                condition: service_started
            ticket-issuance-service:
                condition: service_started
            notifications-service:
                condition: service_started

networks:
    orionticket-services-lab:
        name: orionticket-services-lab
        driver: bridge
