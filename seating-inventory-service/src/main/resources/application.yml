spring:
  application:
    name: seating-inventory-service

  datasource:
    url: jdbc:postgresql://${SEATING_INVENTORY_DB_HOST:${DB_HOST:localhost}}:${SEATING_INVENTORY_DB_PORT:${DB_PORT:5432}}/${SEATING_INVENTORY_DB_NAME:seating_inventory_db}
    username: ${SEATING_INVENTORY_DB_USER:${DB_USER:orion}}
    password: ${SEATING_INVENTORY_DB_PASSWORD:${DB_PASSWORD:secret}}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8083}

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyThatMustBeVeryLongAndSecureForHS256AlgorithmXYZ}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
