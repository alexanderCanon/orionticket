spring:
  application:
    name: seating-inventory-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8081/.well-known/jwks.json}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5000}/orionticketdb
    username: ${GLOBAL_DB_USER:app_user}
    password: ${GLOBAL_DB_PASSWORD:AppSecret789}
    hikari:
      minimum-idle: 10
      connection-init-sql: SET search_path TO ${DB_SCHEMA:seating_inventory}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:seating_inventory}
    create-schemas: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8083}

jwt:
  issuer: ${JWT_ISSUER:orionticket-identity}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
