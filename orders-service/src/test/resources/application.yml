spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  # RabbitMQ: listeners no arrancan automáticamente en tests de integración.
  # El publisher está mockeado con @MockBean, así que no hay conexión real.
  rabbitmq:
    listener:
      simple:
        auto-startup: false

jwt:
  secret: testSecretKeyThatMustBeVeryLongAndSecureForHS256AlgorithmXYZ

orders:
  service-fee:
    rate: 0.10
