spring:
    application:
        name: orders-service
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8081/.well-known/jwks.json}
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5000}/${GLOBAL_DB_NAME}?prepareThreshold=0
        username: ${GLOBAL_DB_USER}
        password: ${GLOBAL_DB_PASSWORD}
        hikari:
            maximum-pool-size: 5
            minimum-idle: 2
            idle-timeout: 300000
            connection-timeout: 20000
            max-lifetime: 1800000
            keepalive-time: 60000
            validation-timeout: 3000
            connection-init-sql: SET search_path TO ${DB_SCHEMA:orders}
            pool-name: orion-db-pool
            data-source-properties:
                stringtype: unspecified
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: false
                default_schema: ${DB_SCHEMA:orders}
    flyway:
        enabled: true
        execute-in-transaction: true
        schemas: ${DB_SCHEMA:orders}
        default-schema: ${DB_SCHEMA:orders}
        create-schemas: true
        baseline-on-migrate: true
        init-sqls: SET search_path TO ${DB_SCHEMA:orders}
        locations: classpath:db/migration

    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USER:guest}
        password: ${RABBITMQ_PASSWORD:guest}

server:
    port: ${SERVER_PORT:8084}

jwt:
    issuer: ${JWT_ISSUER:orionticket-identity}

orders:
    service-fee:
        rate: ${SERVICE_FEE_RATE:0.10}

springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: ${API_DOCS_ENABLED:true}
    swagger-ui:
        path: /swagger-ui.html
        enabled: ${API_DOCS_ENABLED:true}

logging:
    level:
        root: INFO
        com.orionticket: DEBUG
        org.springframework.security: DEBUG

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            show-details: always
