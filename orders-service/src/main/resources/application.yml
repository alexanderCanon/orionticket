spring:
  application:
    name: orders-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5000}/orionticketdb?currentSchema=${DB_SCHEMA:orders}
    username: ${GLOBAL_DB_USER:app_user}
    password: ${GLOBAL_DB_PASSWORD:AppSecret789}
    hikari:
      minimum-idle: 10

  jpa:
    hibernate:
      # "validate" = Hibernate no crea ni modifica tablas; Flyway gestiona el schema
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:orders}
    create-schemas: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8084

# Secret JWT — debe coincidir con Identity Service. En prod viene de variable de entorno.
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyThatMustBeVeryLongAndSecureForHS256AlgorithmXYZ}

# Porcentaje de service fee aplicado al subtotal después de descuento de promoción
orders:
  service-fee:
    rate: ${SERVICE_FEE_RATE:0.10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
