version: '3.8'

services:
  orders-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: secret
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders-service:
    build: .
    ports:
      - "8084:8084"
    environment:
      DB_HOST: orders-db
      DB_PORT: 5432
      DB_USER: orion
      DB_PASSWORD: secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      JWT_ISSUER: orionticket-identity
      IDENTITY_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
    depends_on:
      orders-db:
        condition: service_healthy
