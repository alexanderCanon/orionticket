spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5439/identity_db
    username: orion_identity
    password: identity_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    url: jdbc:postgresql://localhost:5439/identity_db
    user: orion_identity
    password: identity_secret
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8081

logging:
  level:
    root: INFO
    com.orionticket: DEBUG
    org.springframework.security: DEBUG
