# docker-compose.local.yml
#
# Entorno de desarrollo local rápido.
#
# SUPUESTO: Ya tienes una instancia de PostgreSQL accesible (local, remota, o
# gestionada). Este archivo NO levanta contenedores de base de datos.
# Cada microservicio lee su conexión de las variables definidas en tu .env.local.
#
# Uso:
#   cp .env.local.example .env.local   # Configura tus credenciales de DB
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#
# O con Make:
#   make local-up
#   make local-down
#   make local-logs

services:

  # ── Infraestructura ────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orion-rabbitmq-local
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  # ── Microservicios ─────────────────────────────────────────────────────────

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: identity-service-local
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8081
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-local

  event-management-service:
    build:
      context: ./event-management-service
      dockerfile: Dockerfile
    container_name: event-management-service-local
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8082
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${EVENT_MANAGEMENT_SERVICE_PORT:-8082}:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-local

  seating-inventory-service:
    build:
      context: ./seating-inventory-service
      dockerfile: Dockerfile
    container_name: seating-inventory-service-local
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8083
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${SEATING_INVENTORY_SERVICE_PORT:-8083}:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-local

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: orders-service-local
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8084
      RABBITMQ_HOST: rabbitmq
      EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service-local:8082
      SEATING_INVENTORY_SERVICE_URL: http://seating-inventory-service-local:8083
    ports:
      - "${ORDERS_SERVICE_PORT:-8084}:8084"
    depends_on:
      rabbitmq:
        condition: service_healthy
      event-management-service:
        condition: service_started
      seating-inventory-service:
        condition: service_started
    networks:
      - orionticket-local

  payments-service:
    build:
      context: ./payments-service
      dockerfile: Dockerfile
    container_name: payments-service-local
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8085
      RABBITMQ_HOST: rabbitmq
      ORDERS_SERVICE_URL: http://orders-service-local:8084
    ports:
      - "${PAYMENTS_SERVICE_PORT:-8085}:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
      orders-service:
        condition: service_started
    networks:
      - orionticket-local

  ticket-issuance-service:
    build:
      context: ./ticket-issuance-service
      dockerfile: Dockerfile
    container_name: ticket-issuance-service-local
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8086
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${TICKET_ISSUANCE_SERVICE_PORT:-8086}:8086"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-local

  access-control-service:
    build:
      context: ./access-control-service
      dockerfile: Dockerfile
    container_name: access-control-service-local
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8087
      RABBITMQ_HOST: rabbitmq
      TICKET_ISSUANCE_URL: http://ticket-issuance-service-local:8086
    ports:
      - "${ACCESS_CONTROL_SERVICE_PORT:-8087}:8087"
    depends_on:
      rabbitmq:
        condition: service_healthy
      ticket-issuance-service:
        condition: service_started
    networks:
      - orionticket-local

  notifications-service:
    build:
      context: ./notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service-local
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8088
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${NOTIFICATIONS_SERVICE_PORT:-8088}:8088"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-local

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    container_name: reporting-service-local
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8089
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${REPORTING_SERVICE_PORT:-8089}:8089"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-local

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service-local
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-service-local:8081
      EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service-local:8082
      SEATING_INVENTORY_SERVICE_URL: http://seating-inventory-service-local:8083
      ORDERS_SERVICE_URL: http://orders-service-local:8084
      PAYMENTS_SERVICE_URL: http://payments-service-local:8085
      TICKET_ISSUANCE_SERVICE_URL: http://ticket-issuance-service-local:8086
      ACCESS_CONTROL_SERVICE_URL: http://access-control-service-local:8087
      NOTIFICATIONS_SERVICE_URL: http://notifications-service-local:8088
      REPORTING_SERVICE_URL: http://reporting-service-local:8089
    ports:
      - "${GATEWAY_SERVICE_PORT:-8080}:8080"
    depends_on:
      identity-service:
        condition: service_started
      event-management-service:
        condition: service_started
      seating-inventory-service:
        condition: service_started
      orders-service:
        condition: service_started
      payments-service:
        condition: service_started
      ticket-issuance-service:
        condition: service_started
      access-control-service:
        condition: service_started
      notifications-service:
        condition: service_started
      reporting-service:
        condition: service_started
    networks:
      - orionticket-local

# ── Networks ──────────────────────────────────────────────────────────────

networks:
  orionticket-local:
    name: orionticket-local
    driver: bridge
