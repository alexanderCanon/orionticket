spring:
    application:
        name: event-management-service
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5000}/${GLOBAL_DB_NAME}
        username: ${GLOBAL_DB_USER}
        password: ${GLOBAL_DB_PASSWORD}
        hikari:
            maximum-pool-size: 10
            minimum-idle: 2
            idle-timeout: 300000
            connection-timeout: 20000
            max-lifetime: 1800000
            keepalive-time: 60000
            validation-timeout: 3000
            pool-name: orion-db-pool
            data-source-properties:
                stringtype: unspecified
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    flyway:
        enabled: true
        execute-in-transaction: true
        schemas: ${DB_SCHEMA:event_management}
        create-schemas: true
        baseline-on-migrate: true
        locations: classpath:db/migration

    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USER:guest}
        password: ${RABBITMQ_PASSWORD:guest}

server:
    port: ${SERVER_PORT:8082}
    forward-headers-strategy: native
    shutdown: graceful

springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: ${API_DOCS_ENABLED}
    swagger-ui:
        path: /swagger-ui.html
        enabled: ${API_DOCS_ENABLED}

logging:
    level:
        root: INFO
        com.orionticket: DEBUG
        org.springframework.security: DEBUG

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            show-details: always
