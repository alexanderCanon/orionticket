<div class="auth-container">
  <div class="card auth-card">
    <h2>Iniciar Sesión</h2>
    <p class="auth-subtitle">Ingresa a tu cuenta de OrionTicket</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      @if (errorMessage()) {
        <div class="alert alert-error">
          {{ errorMessage() }}
        </div>
      }

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid || isLoading()">
        {{ isLoading() ? 'Ingresando...' : 'Entrar' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a></p>
    </div>
  </div>
</div>
