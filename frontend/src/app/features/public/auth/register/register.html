<div class="auth-container">
  <div class="card auth-card">
    <h2>Registro</h2>
    <p class="auth-subtitle">Únete a OrionTicket y compra tus entradas</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      @if (errorMessage()) {
        <div class="alert alert-error">
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="alert alert-success">
          {{ successMessage() }}
        </div>
      }

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" class="form-control" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="fullName">Nombre Completo</label>
        <input type="text" id="fullName" formControlName="fullName" class="form-control" placeholder="Juan Pérez">
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="registerForm.invalid || isLoading()">
        {{ isLoading() ? 'Registrando...' : 'Crear Cuenta' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión</a></p>
    </div>
  </div>
</div>
