spring:
  application:
    name: accesscontrol-test
    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: http://localhost:8080
            jwk-set-uri: http://localhost:8080/.well-known/jwks.json

  security:
    filter:
      order: -10

app:
  ticket-issuance:
    base-url: http://localhost:8087
    timeout-ms: 100
  validation:
    offline-sync-max-records: 100