services:
    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: orion-rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
        ports:
            - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBIT_PORT:-5672}:5672"
            - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "check_running"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    rabbitmq_data:

networks:
    orion-rabbitmq:
        name: orion-rabbitmq
        driver: bridge
