spring:
    application:
        name: notifications-service
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8081/.well-known/jwks.json}
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5000}/${GLOBAL_DB_NAME}?prepareThreshold=0&currentSchema=${DB_SCHEMA:notifications}
        username: ${GLOBAL_DB_USER}
        password: ${GLOBAL_DB_PASSWORD}
        hikari:
            maximum-pool-size: 5
            minimum-idle: 2
            idle-timeout: 300000
            connection-timeout: 20000
            max-lifetime: 1800000
            keepalive-time: 60000
            validation-timeout: 3000
            connection-init-sql: SET search_path TO ${DB_SCHEMA:notifications}
            pool-name: orion-db-pool
            data-source-properties:
                stringtype: unspecified
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: false
                default_schema: ${DB_SCHEMA:notifications}
    flyway:
        enabled: true
        execute-in-transaction: true
        schemas: ${DB_SCHEMA:notifications}
        default-schema: ${DB_SCHEMA:notifications}
        create-schemas: true
        baseline-on-migrate: true
        validate-on-migrate: false
        init-sqls: SET search_path TO ${DB_SCHEMA:notifications}
        locations: classpath:db/migration
    mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:1025}
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:guest}}
        password: ${RABBITMQ_PASSWORD:guest}

server:
    port: ${SERVER_PORT:8088}

springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: ${API_DOCS_ENABLED:true}
    swagger-ui:
        path: /swagger-ui.html
        enabled: ${API_DOCS_ENABLED:true}

logging:
    level:
        root: INFO
        com.orionticket: DEBUG
        org.springframework.security: DEBUG

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            show-details: always
    health:
        mail:
            enabled: false

notifications:
    email:
        enabled: ${NOTIFICATIONS_EMAIL_ENABLED:true}
        api-key: ${RESEND_API_KEY:re_placeholder}
        from-email: ${RESEND_FROM_EMAIL:tickets@orionticket.local}
        from-name: ${RESEND_FROM_NAME:OrionTicket}

jwt:
    issuer: ${JWT_ISSUER:orionticket-identity}
