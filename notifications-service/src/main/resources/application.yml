server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: notifications-service
  datasource:
    url: jdbc:postgresql://${NOTIFICATIONS_DB_HOST:localhost}:${NOTIFICATIONS_DB_PORT:5432}/${NOTIFICATIONS_DB_NAME:notifications_db}
    username: ${NOTIFICATIONS_DB_USER:notifications}
    password: ${NOTIFICATIONS_DB_PASSWORD:notifications}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
