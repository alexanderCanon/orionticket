spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5000}/${GLOBAL_DB_NAME}?prepareThreshold=0
    username: ${GLOBAL_DB_USER}
    password: ${GLOBAL_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      keepalive-time: 60000
      validation-timeout: 3000
      pool-name: orion-db-pool
      data-source-properties:
        stringtype: unspecified
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:reporting}
  flyway:
    enabled: true
    execute-in-transaction: true
    schemas: ${DB_SCHEMA:reporting}
    default-schema: ${DB_SCHEMA:reporting}
    create-schemas: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8089}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:true}

logging:
  level:
    root: INFO
    com.orionticket: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
