spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://${REPORTING_DB_HOST:localhost}:${REPORTING_DB_PORT:5432}/${REPORTING_DB_NAME:reporting_db}
    username: ${REPORTING_DB_USER:reporting}
    password: ${REPORTING_DB_PASSWORD:reporting}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.orionticket: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
