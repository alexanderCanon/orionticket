spring:
  application:
    name: payments-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8081/.well-known/jwks.json}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5000}/orionticketdb
    username: ${GLOBAL_DB_USER:app_user}
    password: ${GLOBAL_DB_PASSWORD:AppSecret789}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 10
      connection-init-sql: SET search_path TO ${DB_SCHEMA:payments}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:payments}
    create-schemas: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2.0
  scheduling:
    enabled: true

server:
  port: ${SERVER_PORT:8085}

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtdmFsaWRhdGlvbi1pbi1vcmlvbnRpY2tldA==}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- RabbitMQ topology names ---
rabbitmq:
  exchanges:
    payments: orionticket.events.exchange
    orders: orionticket.events.exchange
    event-management: orionticket.events.exchange
  queues:
    order-created: payments.queue.order-created
    date-added: payments.queue.date-added

# --- Inter-service URLs ---
services:
  orders:
    base-url: ${ORDERS_SERVICE_URL:http://localhost:8083}
  event-management:
    base-url: ${EVENT_MANAGEMENT_SERVICE_URL:http://localhost:8082}

# --- Stripe ---
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# --- JWT Security ---
jwt:
  issuer: ${JWT_ISSUER:orionticket-identity}

# --- Payout generation scheduler ---
scheduling:
  payout-generation:
    cron: ${PAYOUT_GENERATION_CRON:0 0 * * * *}  # every hour

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    build:
      enabled: true
    git:
      mode: simple

# --- Logging ---
logging:
  level:
    root: INFO
    com.orionticket: DEBUG
    org.springframework.security: INFO
    org.springframework.web.client: DEBUG
    org.springframework.amqp: INFO
