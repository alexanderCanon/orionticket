spring:
  application:
    name: payments-service
  datasource:
    url: jdbc:postgresql://${PAYMENTS_DB_HOST:localhost}:${PAYMENTS_DB_PORT:5432}/${PAYMENTS_DB_NAME:payments_db}
    username: ${PAYMENTS_DB_USER:orion_payments}
    password: ${PAYMENTS_DB_PASSWORD:payments_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    url: jdbc:postgresql://${PAYMENTS_DB_HOST:localhost}:${PAYMENTS_DB_PORT:5432}/${PAYMENTS_DB_NAME:payments_db}
    user: ${PAYMENTS_DB_USER:orion_payments}
    password: ${PAYMENTS_DB_PASSWORD:payments_secret}
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2.0
  scheduling:
    enabled: true

server:
  port: ${SERVER_PORT:8085}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- RabbitMQ topology names ---
rabbitmq:
  exchanges:
    payments: payments.events
    orders: orders.events
    event-management: event-mgmt.events
  queues:
    order-created: payments.queue.order-created
    date-added: payments.queue.date-added

# --- Inter-service URLs ---
services:
  orders:
    base-url: ${ORDERS_SERVICE_URL:http://localhost:8083}
  event-management:
    base-url: ${EVENT_MANAGEMENT_SERVICE_URL:http://localhost:8082}

# --- Stripe ---
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# --- Payout generation scheduler ---
scheduling:
  payout-generation:
    cron: ${PAYOUT_GENERATION_CRON:0 0 * * * *}  # every hour

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    build:
      enabled: true
    git:
      mode: simple

# --- Logging ---
logging:
  level:
    root: INFO
    com.orionticket: DEBUG
    org.springframework.security: INFO
    org.springframework.web.client: DEBUG
    org.springframework.amqp: INFO
