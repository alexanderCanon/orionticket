spring:
    application:
        name: payments-service
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8081/.well-known/jwks.json}
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5000}/${GLOBAL_DB_NAME}?prepareThreshold=0
        username: ${GLOBAL_DB_USER}
        password: ${GLOBAL_DB_PASSWORD}
        hikari:
            maximum-pool-size: 5
            minimum-idle: 2
            idle-timeout: 300000
            connection-timeout: 20000
            max-lifetime: 1800000
            keepalive-time: 60000
            validation-timeout: 3000
            pool-name: orion-db-pool
            data-source-properties:
                stringtype: unspecified
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: false
                default_schema: ${DB_SCHEMA:payments}
    flyway:
        enabled: true
        execute-in-transaction: true
        schemas: ${DB_SCHEMA:payments}
        default-schema: ${DB_SCHEMA:payments}
        create-schemas: true
        baseline-on-migrate: true
        locations: classpath:db/migration
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USER:guest}
        password: ${RABBITMQ_PASSWORD:guest}
        listener:
            simple:
                retry:
                    enabled: true
                    initial-interval: 3000
                    max-attempts: 3
                    multiplier: 2.0
    scheduling:
        enabled: true

server:
    port: ${SERVER_PORT:8085}

springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: ${API_DOCS_ENABLED:true}
    swagger-ui:
        path: /swagger-ui.html
        enabled: ${API_DOCS_ENABLED:true}

# --- RabbitMQ topology names ---
rabbitmq:
    exchanges:
        payments: payments.events
        orders: orders.events
        event-management: event-mgmt.events
    queues:
        order-created: payments.queue.order-created
        date-added: payments.queue.date-added

# --- Inter-service URLs ---
services:
    orders:
        base-url: ${ORDERS_SERVICE_URL:http://localhost:8084}
    event-management:
        base-url: ${EVENT_MANAGEMENT_SERVICE_URL:http://localhost:8082}

# --- Stripe ---
stripe:
    api-key: ${STRIPE_API_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# --- JWT Security ---
jwt:
    issuer: ${JWT_ISSUER:orionticket-identity}

# --- Payout generation scheduler ---
scheduling:
    payout-generation:
        cron: ${PAYOUT_GENERATION_CRON:0 0 * * * *}

logging:
    level:
        root: INFO
        com.orionticket: DEBUG
        org.springframework.security: INFO
        org.springframework.web.client: DEBUG
        org.springframework.amqp: INFO

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            show-details: always
