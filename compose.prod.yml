      retries: 3
      start_period: 60s

  notifications-service:
    build:
      context: ./notifications-service
      dockerfile: Dockerfile
    image: orionticket/notifications-service:${IMAGE_TAG:-latest}
    container_name: notifications-service
    env_file:
      - ${ORION_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      DB_HOST: ${IP_NUBE:?IP_NUBE is required}
      DB_PORT: 5000
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${NOTIFICATIONS_SERVICE_PORT:-8088}:8088"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-prod
    deploy:
      resources:
        limits:
          memory: ${SERVICE_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    image: orionticket/reporting-service:${IMAGE_TAG:-latest}
    container_name: reporting-service
    env_file:
      - ${ORION_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8089
      DB_HOST: ${IP_NUBE:?IP_NUBE is required}
      DB_PORT: 5000
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${REPORTING_SERVICE_PORT:-8089}:8089"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-prod
    deploy:
      resources:
        limits:
          memory: ${SERVICE_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
