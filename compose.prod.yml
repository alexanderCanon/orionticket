# Production backend stack.
#
# Levanta los 9 microservicios de negocio y RabbitMQ. No levanta PostgreSQL:
# todos los servicios conectan a la DB externa por HAProxy en ${IP_NUBE}:5000.
# El API Gateway vive en otro repo/VPS.

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orion-rabbitmq-prod
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-prod

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    image: orionticket/identity-service:${IMAGE_TAG:-latest}
    container_name: identity-service
    env_file:
      - ${ORION_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_HOST: ${IP_NUBE:?IP_NUBE is required}
      DB_PORT: 5000
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-prod
    deploy:
      resources:
        limits:
          memory: ${SERVICE_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  event-management-service:
    build:
      context: ./event-management-service
      dockerfile: Dockerfile
    image: orionticket/event-management-service:${IMAGE_TAG:-latest}
    container_name: event-management-service
    env_file:
      - ${ORION_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      DB_HOST: ${IP_NUBE:?IP_NUBE is required}
      DB_PORT: 5000
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${EVENT_MANAGEMENT_SERVICE_PORT:-8082}:8082"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-prod
    deploy:
      resources:
        limits:
          memory: ${SERVICE_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  seating-inventory-service:
    build:
      context: ./seating-inventory-service
      dockerfile: Dockerfile
    image: orionticket/seating-inventory-service:${IMAGE_TAG:-latest}
    container_name: seating-inventory-service
    env_file:
      - ${ORION_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      DB_HOST: ${IP_NUBE:?IP_NUBE is required}
      DB_PORT: 5000
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${SEATING_INVENTORY_SERVICE_PORT:-8083}:8083"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-prod
    deploy:
      resources:
        limits:
          memory: ${SERVICE_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    image: orionticket/orders-service:${IMAGE_TAG:-latest}
    container_name: orders-service
    env_file:
      - ${ORION_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      DB_HOST: ${IP_NUBE:?IP_NUBE is required}
      DB_PORT: 5000
      RABBITMQ_HOST: rabbitmq
      EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service:8082
      SEATING_INVENTORY_SERVICE_URL: http://seating-inventory-service:8083
    ports:
      - "${ORDERS_SERVICE_PORT:-8084}:8084"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      event-management-service:
        condition: service_healthy
      seating-inventory-service:
        condition: service_healthy
    networks:
      - orionticket-prod
    deploy:
      resources:
        limits:
          memory: ${SERVICE_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  payments-service:
    build:
      context: ./payments-service
      dockerfile: Dockerfile
    image: orionticket/payments-service:${IMAGE_TAG:-latest}
    container_name: payments-service
    env_file:
      - ${ORION_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8085
      DB_HOST: ${IP_NUBE:?IP_NUBE is required}
      DB_PORT: 5000
      RABBITMQ_HOST: rabbitmq
      ORDERS_SERVICE_URL: http://orders-service:8084
      EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service:8082
    ports:
      - "${PAYMENTS_SERVICE_PORT:-8085}:8085"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      event-management-service:
        condition: service_healthy
    networks:
      - orionticket-prod
    deploy:
      resources:
        limits:
          memory: ${SERVICE_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ticket-issuance-service:
    build:
      context: ./ticket-issuance-service
      dockerfile: Dockerfile
    image: orionticket/ticket-issuance-service:${IMAGE_TAG:-latest}
    container_name: ticket-issuance-service
    env_file:
      - ${ORION_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8086
      DB_HOST: ${IP_NUBE:?IP_NUBE is required}
      DB_PORT: 5000
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${TICKET_ISSUANCE_SERVICE_PORT:-8086}:8086"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orionticket-prod
    deploy:
      resources:
        limits:
          memory: ${SERVICE_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  access-control-service:
    build:
      context: ./access-control-service
      dockerfile: Dockerfile
    image: orionticket/access-control-service:${IMAGE_TAG:-latest}
    container_name: access-control-service
    env_file:
      - ${ORION_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8087
      DB_HOST: ${IP_NUBE:?IP_NUBE is required}
      DB_PORT: 5000
      RABBITMQ_HOST: rabbitmq
      TICKET_ISSUANCE_URL: http://ticket-issuance-service:8086
    ports:
      - "${ACCESS_CONTROL_SERVICE_PORT:-8087}:8087"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      ticket-issuance-service:
        condition: service_healthy
    networks:
      - orionticket-prod
    deploy:
      resources:
        limits:
          memory: ${SERVICE_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
