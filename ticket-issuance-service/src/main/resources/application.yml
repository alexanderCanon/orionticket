server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ticket-issuance-service
  datasource:
    url: jdbc:postgresql://${TICKET_ISSUANCE_DB_HOST:localhost}:${TICKET_ISSUANCE_DB_PORT:5432}/${TICKET_ISSUANCE_DB_NAME:ticket_issuance_db}
    username: ${TICKET_ISSUANCE_DB_USER:ticket_issuance}
    password: ${TICKET_ISSUANCE_DB_PASSWORD:ticket_issuance}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
