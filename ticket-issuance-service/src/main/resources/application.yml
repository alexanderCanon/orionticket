server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ticket-issuance-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticket_issuance}
    username: ${DB_USERNAME:ticket_issuance}
    password: ${DB_PASSWORD:ticket_issuance}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
