services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orion-rabbitmq
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  orionticket-db:
    image: postgres:16-alpine
    container_name: orionticket-db
    environment:
      POSTGRES_USER: ${GLOBAL_DB_USER:-app_user}
      POSTGRES_PASSWORD: ${GLOBAL_DB_PASSWORD:-AppSecret789}
      POSTGRES_DB: ${GLOBAL_DB_NAME:-orionticketdb}
    ports:
      - "5000:5432"
    volumes:
      - orionticket_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GLOBAL_DB_USER:-app_user} -d ${GLOBAL_DB_NAME:-orionticketdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  # ── Microservices ─────────────────────────────────────────────────────────

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8081
      DB_HOST: orionticket-db
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      orionticket-db:
        condition: service_healthy
    networks:
      - orionticket-local

  event-management-service:
    build:
      context: ./event-management-service
      dockerfile: Dockerfile
    container_name: event-management-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8082
      DB_HOST: orionticket-db
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${EVENT_MANAGEMENT_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      orionticket-db:
        condition: service_healthy
    networks:
      - orionticket-local

  seating-inventory-service:
    build:
      context: ./seating-inventory-service
      dockerfile: Dockerfile
    container_name: seating-inventory-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8083
      DB_HOST: orionticket-db
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${SEATING_INVENTORY_SERVICE_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      orionticket-db:
        condition: service_healthy
    networks:
      - orionticket-local

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8084
      DB_HOST: orionticket-db
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service:8082
      SEATING_INVENTORY_SERVICE_URL: http://seating-inventory-service:8083
    ports:
      - "${ORDERS_SERVICE_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      orionticket-db:
        condition: service_healthy
      event-management-service:
        condition: service_healthy
      seating-inventory-service:
        condition: service_healthy
    networks:
      - orionticket-local

  payments-service:
    build:
      context: ./payments-service
      dockerfile: Dockerfile
    container_name: payments-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8085
      DB_HOST: orionticket-db
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      ORDERS_SERVICE_URL: http://orders-service:8084
    ports:
      - "${PAYMENTS_SERVICE_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      orionticket-db:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    networks:
      - orionticket-local

  ticket-issuance-service:
    build:
      context: ./ticket-issuance-service
      dockerfile: Dockerfile
    container_name: ticket-issuance-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8086
      DB_HOST: orionticket-db
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${TICKET_ISSUANCE_SERVICE_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      orionticket-db:
        condition: service_healthy
    networks:
      - orionticket-local

  access-control-service:
    build:
      context: ./access-control-service
      dockerfile: Dockerfile
    container_name: access-control-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8087
      DB_HOST: orionticket-db
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      TICKET_ISSUANCE_URL: http://ticket-issuance-service:8086
    ports:
      - "${ACCESS_CONTROL_SERVICE_PORT:-8087}:8087"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      orionticket-db:
        condition: service_healthy
      ticket-issuance-service:
        condition: service_healthy
    networks:
      - orionticket-local

  notifications-service:
    build:
      context: ./notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8088
      DB_HOST: orionticket-db
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${NOTIFICATIONS_SERVICE_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      orionticket-db:
        condition: service_healthy
    networks:
      - orionticket-local

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    container_name: reporting-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8089
      DB_HOST: orionticket-db
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${REPORTING_SERVICE_PORT:-8089}:8089"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8089/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      orionticket-db:
        condition: service_healthy
    networks:
      - orionticket-local

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-service:8081
      EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service:8082
      SEATING_INVENTORY_SERVICE_URL: http://seating-inventory-service:8083
      ORDERS_SERVICE_URL: http://orders-service:8084
      PAYMENTS_SERVICE_URL: http://payments-service:8085
      TICKET_ISSUANCE_SERVICE_URL: http://ticket-issuance-service:8086
      ACCESS_CONTROL_SERVICE_URL: http://access-control-service:8087
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8088
      REPORTING_SERVICE_URL: http://reporting-service:8089
    ports:
      - "${GATEWAY_SERVICE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: on-failure
    depends_on:
      identity-service:
        condition: service_healthy
      event-management-service:
        condition: service_healthy
      seating-inventory-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
      ticket-issuance-service:
        condition: service_healthy
      access-control-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    networks:
      - orionticket-local

# ── Volumes ───────────────────────────────────────────────────────────────

volumes:
  orionticket_db_data:

# ── Networks ──────────────────────────────────────────────────────────────

networks:
  orionticket-local:
    name: orionticket-local
    driver: bridge
