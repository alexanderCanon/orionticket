services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orion-rabbitmq
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  # ── Databases ─────────────────────────────────────────────────────────────

  identity-db:
    image: postgres:16-alpine
    container_name: identity-db
    environment:
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity_user}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_password}
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity_db}
    ports:
      - "5433:5432"
    volumes:
      - identity_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER:-identity_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  event-management-db:
    image: postgres:16-alpine
    container_name: event-management-db
    environment:
      POSTGRES_USER: ${EVENT_MANAGEMENT_DB_USER:-event_management_user}
      POSTGRES_PASSWORD: ${EVENT_MANAGEMENT_DB_PASSWORD:-event_management_password}
      POSTGRES_DB: ${EVENT_MANAGEMENT_DB_NAME:-event_management_db}
    ports:
      - "5434:5432"
    volumes:
      - event_management_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENT_MANAGEMENT_DB_USER:-event_management_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  seating-inventory-db:
    image: postgres:16-alpine
    container_name: seating-inventory-db
    environment:
      POSTGRES_USER: ${SEATING_INVENTORY_DB_USER:-seating_inventory_user}
      POSTGRES_PASSWORD: ${SEATING_INVENTORY_DB_PASSWORD:-seating_inventory_password}
      POSTGRES_DB: ${SEATING_INVENTORY_DB_NAME:-seating_inventory_db}
    ports:
      - "5435:5432"
    volumes:
      - seating_inventory_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEATING_INVENTORY_DB_USER:-seating_inventory_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  orders-db:
    image: postgres:16-alpine
    container_name: orders-db
    environment:
      POSTGRES_USER: ${ORDERS_DB_USER:-orders_user}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_password}
      POSTGRES_DB: ${ORDERS_DB_NAME:-orders_db}
    ports:
      - "5436:5432"
    volumes:
      - orders_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDERS_DB_USER:-orders_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  payments-db:
    image: postgres:16-alpine
    container_name: payments-db
    environment:
      POSTGRES_USER: ${PAYMENTS_DB_USER:-payments_user}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments_password}
      POSTGRES_DB: ${PAYMENTS_DB_NAME:-payments_db}
    ports:
      - "5437:5432"
    volumes:
      - payments_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_DB_USER:-payments_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  ticket-issuance-db:
    image: postgres:16-alpine
    container_name: ticket-issuance-db
    environment:
      POSTGRES_USER: ${TICKET_ISSUANCE_DB_USER:-ticket_issuance_user}
      POSTGRES_PASSWORD: ${TICKET_ISSUANCE_DB_PASSWORD:-ticket_issuance_password}
      POSTGRES_DB: ${TICKET_ISSUANCE_DB_NAME:-ticket_issuance_db}
    ports:
      - "5438:5432"
    volumes:
      - ticket_issuance_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TICKET_ISSUANCE_DB_USER:-ticket_issuance_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  access-control-db:
    image: postgres:16-alpine
    container_name: access-control-db
    environment:
      POSTGRES_USER: ${ACCESS_CONTROL_DB_USER:-access_control_user}
      POSTGRES_PASSWORD: ${ACCESS_CONTROL_DB_PASSWORD:-access_control_password}
      POSTGRES_DB: ${ACCESS_CONTROL_DB_NAME:-access_control_db}
    ports:
      - "5439:5432"
    volumes:
      - access_control_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCESS_CONTROL_DB_USER:-access_control_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  notifications-db:
    image: postgres:16-alpine
    container_name: notifications-db
    environment:
      POSTGRES_USER: ${NOTIFICATIONS_DB_USER:-notifications_user}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications_password}
      POSTGRES_DB: ${NOTIFICATIONS_DB_NAME:-notifications_db}
    ports:
      - "5440:5432"
    volumes:
      - notifications_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATIONS_DB_USER:-notifications_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  reporting-db:
    image: postgres:16-alpine
    container_name: reporting-db
    environment:
      POSTGRES_USER: ${REPORTING_DB_USER:-reporting_user}
      POSTGRES_PASSWORD: ${REPORTING_DB_PASSWORD:-reporting_password}
      POSTGRES_DB: ${REPORTING_DB_NAME:-reporting_db}
    ports:
      - "5441:5432"
    volumes:
      - reporting_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPORTING_DB_USER:-reporting_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orionticket-local

  # ── Microservices ─────────────────────────────────────────────────────────

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8081
      IDENTITY_DB_HOST: identity-db
      IDENTITY_DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      identity-db:
        condition: service_healthy
    networks:
      - orionticket-local

  event-management-service:
    build:
      context: ./event-management-service
      dockerfile: Dockerfile
    container_name: event-management-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8082
      EVENT_MANAGEMENT_DB_HOST: event-management-db
      EVENT_MANAGEMENT_DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${EVENT_MANAGEMENT_SERVICE_PORT:-8082}:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      event-management-db:
        condition: service_healthy
    networks:
      - orionticket-local

  seating-inventory-service:
    build:
      context: ./seating-inventory-service
      dockerfile: Dockerfile
    container_name: seating-inventory-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8083
      SEATING_INVENTORY_DB_HOST: seating-inventory-db
      SEATING_INVENTORY_DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${SEATING_INVENTORY_SERVICE_PORT:-8083}:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
      seating-inventory-db:
        condition: service_healthy
    networks:
      - orionticket-local

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8084
      ORDERS_DB_HOST: orders-db
      ORDERS_DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service:8082
      SEATING_INVENTORY_SERVICE_URL: http://seating-inventory-service:8083
    ports:
      - "${ORDERS_SERVICE_PORT:-8084}:8084"
    depends_on:
      rabbitmq:
        condition: service_healthy
      orders-db:
        condition: service_healthy
      event-management-service:
        condition: service_started
      seating-inventory-service:
        condition: service_started
    networks:
      - orionticket-local

  payments-service:
    build:
      context: ./payments-service
      dockerfile: Dockerfile
    container_name: payments-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8085
      PAYMENTS_DB_HOST: payments-db
      PAYMENTS_DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      ORDERS_SERVICE_URL: http://orders-service:8084
    ports:
      - "${PAYMENTS_SERVICE_PORT:-8085}:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
      payments-db:
        condition: service_healthy
      orders-service:
        condition: service_started
    networks:
      - orionticket-local

  ticket-issuance-service:
    build:
      context: ./ticket-issuance-service
      dockerfile: Dockerfile
    container_name: ticket-issuance-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8086
      TICKET_ISSUANCE_DB_HOST: ticket-issuance-db
      TICKET_ISSUANCE_DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${TICKET_ISSUANCE_SERVICE_PORT:-8086}:8086"
    depends_on:
      rabbitmq:
        condition: service_healthy
      ticket-issuance-db:
        condition: service_healthy
    networks:
      - orionticket-local

  access-control-service:
    build:
      context: ./access-control-service
      dockerfile: Dockerfile
    container_name: access-control-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8087
      ACCESS_CONTROL_DB_HOST: access-control-db
      ACCESS_CONTROL_DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      TICKET_ISSUANCE_URL: http://ticket-issuance-service:8086
    ports:
      - "${ACCESS_CONTROL_SERVICE_PORT:-8087}:8087"
    depends_on:
      rabbitmq:
        condition: service_healthy
      access-control-db:
        condition: service_healthy
      ticket-issuance-service:
        condition: service_started
    networks:
      - orionticket-local

  notifications-service:
    build:
      context: ./notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8088
      NOTIFICATIONS_DB_HOST: notifications-db
      NOTIFICATIONS_DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${NOTIFICATIONS_SERVICE_PORT:-8088}:8088"
    depends_on:
      rabbitmq:
        condition: service_healthy
      notifications-db:
        condition: service_healthy
    networks:
      - orionticket-local

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    container_name: reporting-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8089
      REPORTING_DB_HOST: reporting-db
      REPORTING_DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${REPORTING_SERVICE_PORT:-8089}:8089"
    depends_on:
      rabbitmq:
        condition: service_healthy
      reporting-db:
        condition: service_healthy
    networks:
      - orionticket-local

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-service:8081
      EVENT_MANAGEMENT_SERVICE_URL: http://event-management-service:8082
      SEATING_INVENTORY_SERVICE_URL: http://seating-inventory-service:8083
      ORDERS_SERVICE_URL: http://orders-service:8084
      PAYMENTS_SERVICE_URL: http://payments-service:8085
      TICKET_ISSUANCE_SERVICE_URL: http://ticket-issuance-service:8086
      ACCESS_CONTROL_SERVICE_URL: http://access-control-service:8087
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8088
      REPORTING_SERVICE_URL: http://reporting-service:8089
    ports:
      - "${GATEWAY_SERVICE_PORT:-8080}:8080"
    depends_on:
      identity-service:
        condition: service_started
      event-management-service:
        condition: service_started
      seating-inventory-service:
        condition: service_started
      orders-service:
        condition: service_started
      payments-service:
        condition: service_started
      ticket-issuance-service:
        condition: service_started
      access-control-service:
        condition: service_started
      notifications-service:
        condition: service_started
      reporting-service:
        condition: service_started
    networks:
      - orionticket-local

# ── Volumes ───────────────────────────────────────────────────────────────

volumes:
  identity_pg_data:
  event_management_pg_data:
  seating_inventory_pg_data:
  orders_pg_data:
  payments_pg_data:
  ticket_issuance_pg_data:
  access_control_pg_data:
  notifications_pg_data:
  reporting_pg_data:

# ── Networks ──────────────────────────────────────────────────────────────

networks:
  orionticket-local:
    name: orionticket-local
    driver: bridge
